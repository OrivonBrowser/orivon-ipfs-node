name: Fresh lookup rig

# Builds the native node and times how long a fetcher takes to find the provider of a share announced a
# moment ago, on Linux, macOS and Windows runners (orivon/fresh-lookup-check.py). Runs on a manual dispatch,
# and on a push to the branch whose commit message holds [rig].
on:
  workflow_dispatch:
    inputs:
      args:
        description: Extra arguments for orivon/fresh-lookup-check.py
        default: ''
      node_ref:
        description: Build the node from this commit instead (the script stays the branch's)
        default: ''
      os:
        description: Run on this runner only (ubuntu-latest, macos-latest or windows-latest); empty runs all three
        default: ''
      env:
        description: NAME=value pairs the rig and the serve node start with, separated by spaces
        default: ''
  push:
    branches: [fix/fresh-lookup]

permissions:
  contents: read

env:
  # Git Bash on Windows would turn an argument that starts with / into a path.
  MSYS_NO_PATHCONV: '1'
  MSYS2_ARG_CONV_EXCL: '*'
  RELAY: /ip4/152.228.138.30/tcp/4003/p2p/12D3KooWReTq9frXSU18aXYvksPBQRWj9qafTSB4gxgUg6QqqnqJ

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rig]')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick the runners
        id: pick
        env:
          ONLY: ${{ inputs.os }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          every = [
              {"os": "ubuntu-latest", "exe": "", "kubo": "linux-amd64.tar.gz"},
              {"os": "macos-latest", "exe": "", "kubo": "darwin-arm64.tar.gz"},
              {"os": "windows-latest", "exe": ".exe", "kubo": "windows-amd64.zip"},
          ]
          only = os.environ.get("ONLY", "")
          print("matrix=" + json.dumps({"include": [m for m in every if not only or m["os"] == only]}))
          PY

  rig:
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Take the node's source from another commit
        if: inputs.node_ref != ''
        shell: bash
        env:
          NODE_REF: ${{ inputs.node_ref }}
        run: |
          git rm -r -q --cached crates vendor Cargo.toml Cargo.lock
          rm -rf crates vendor Cargo.toml Cargo.lock
          git checkout "$NODE_REF" -- crates vendor Cargo.toml Cargo.lock
          git log -1 --oneline "$NODE_REF"

      - name: Stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rig-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rig-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            rig-${{ runner.os }}-

      - name: Build the node
        run: cargo build --release -p orivon-ipfs-gateway --locked

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Kubo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/ipfs/kubo/releases/latest --jq .tag_name)
          mkdir -p "$RUNNER_TEMP/kubo-dl" "$RUNNER_TEMP/kubo"
          gh release download "$tag" -R ipfs/kubo -p 'kubo_*_${{ matrix.kubo }}' -D "$RUNNER_TEMP/kubo-dl"
          case "${{ matrix.kubo }}" in
            *.zip) 7z x -y -o"$RUNNER_TEMP/kubo" "$RUNNER_TEMP"/kubo-dl/kubo_*.zip > /dev/null ;;
            *) tar -xzf "$RUNNER_TEMP"/kubo-dl/kubo_*.tar.gz -C "$RUNNER_TEMP/kubo" ;;
          esac
          echo "IPFS=$RUNNER_TEMP/kubo/kubo/ipfs${{ matrix.exe }}" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/kubo/kubo/ipfs${{ matrix.exe }}" --version

      - name: Rig
        shell: bash
        env:
          EXTRA: ${{ inputs.args }}
          PAIRS: ${{ inputs.env }}
        run: |
          for pair in $PAIRS; do export "$pair"; done
          python orivon/fresh-lookup-check.py --node "target/release/orivon-ipfs-gateway${{ matrix.exe }}" \
            --ipfs "$IPFS" --relay "$RELAY" --out "$RUNNER_TEMP/rig-out" $EXTRA 2>&1 | tee "$RUNNER_TEMP/rig.txt"

      - name: Walks the node logged
        if: always()
        shell: bash
        run: |
          cat "$RUNNER_TEMP"/rig-out/node-*.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | grep -a -E 'dht_walk|dht_provider_lookup|delegated_provider_lookup' | cut -c1-420 | head -150 || true

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rig-${{ matrix.os }}
          path: ${{ runner.temp }}/rig-out
          if-no-files-found: ignore
