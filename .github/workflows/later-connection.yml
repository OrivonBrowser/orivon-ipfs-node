name: Later connection check

# Serves a folder from the native node, behind Orivon's circuit relay and directly, and asks for one
# more file on a new connection after 0, 20, 60 and 120 seconds, with Kubo and with a second copy of
# the node as the fetcher (orivon/later-connection-check.sh).
on:
  workflow_dispatch:
  push:
    branches: [fix/later-connection]

permissions:
  contents: read

env:
  RELAY: /ip4/152.228.138.30/tcp/4003/p2p/12D3KooWReTq9frXSU18aXYvksPBQRWj9qafTSB4gxgUg6QqqnqJ

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build the node
        run: cargo build -p orivon-ipfs-gateway --locked

      - name: Keep the binary
        uses: actions/upload-artifact@v7
        with:
          name: node
          path: target/debug/orivon-ipfs-gateway

  ladder:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fetcher: kubo, via: relay, broadcast: off }
          - { fetcher: kubo, via: relay, broadcast: on }
          - { fetcher: kubo, via: direct, broadcast: off }
          - { fetcher: node, via: relay, broadcast: off }
          - { fetcher: node, via: direct, broadcast: off }
    name: ${{ matrix.fetcher }} ${{ matrix.via }} broadcast ${{ matrix.broadcast }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Take the node
        uses: actions/download-artifact@v8
        with:
          name: node
          path: bin

      - name: Kubo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/ipfs/kubo/releases/latest --jq .tag_name)
          gh release download "$tag" -R ipfs/kubo -p 'kubo_*_linux-amd64.tar.gz' -D "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/kubo"
          tar -xzf "$RUNNER_TEMP"/kubo_*_linux-amd64.tar.gz -C "$RUNNER_TEMP/kubo"
          echo "IPFS=$RUNNER_TEMP/kubo/kubo/ipfs" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/kubo/kubo/ipfs" --version

      - name: Ladder
        env:
          FETCHER: ${{ matrix.fetcher }}
          VIA: ${{ matrix.via }}
          BROADCAST: ${{ matrix.broadcast }}
          LOG_DIR: ${{ runner.temp }}/logs
        run: |
          chmod +x bin/orivon-ipfs-gateway
          export NODE_BIN="$PWD/bin/orivon-ipfs-gateway"
          set -o pipefail
          bash orivon/later-connection-check.sh 2>&1 | tee "$RUNNER_TEMP/ladder.txt"

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.fetcher }} ${{ matrix.via }} broadcast ${{ matrix.broadcast }}"
            echo '```'
            grep -a '^LADDER' "$RUNNER_TEMP/ladder.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.fetcher }}-${{ matrix.via }}-${{ matrix.broadcast }}
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore
